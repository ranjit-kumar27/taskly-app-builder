spring:
  application:
    name: Taskly

  # Secrets live in backend/.env (gitignored; copy .env.example to start).
  # Real environment variables override values from the file.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: localhost
      port: 6379


  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        options:
          model: ${AI_MODEL}
          temperature: 0.0

jwt:
  secret-key: ${JWT_SECRET}


stripe:
  api:
    secret: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}


client.url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

preview:
  # local = run `npm run dev` on this machine; kubernetes = runner pods in the shuttle-apps namespace
  mode: ${PREVIEW_MODE:local}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  project-bucket: projects
